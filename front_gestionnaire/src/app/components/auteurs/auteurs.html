<div class="container mt-4">
    <h2 class="section-title">Nos auteurs</h2>

    <div class="row g-4">
        @for (auteur of auteurs(); track auteur.id) {
            <div class="col-md-4 col-lg-3">
                <div class="card author-card h-100">
                    <div class="author-avatar">
                        {{ auteur.prenom.charAt(0) }}{{ auteur.nom.charAt(0) }}
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">{{ auteur.prenom }} {{ auteur.nom }}</h5>
                        @if (auteur.biographie) {
                            <p class="text-muted small">{{ auteur.biographie | slice:0:100 }}...</p>
                        }
                    </div>
                    <div class="card-footer text-center">
                        <a [routerLink]="['/auteurs', auteur.id]" class="btn btn-sm btn-outline-primary">
                            Voir le profil →
                        </a>
                    </div>
                </div>
            </div>
        } @empty {
            <div class="col-12">
                <div class="alert alert-info text-center">Aucun auteur trouvé.</div>
            </div>
        }
    </div>
</div>
