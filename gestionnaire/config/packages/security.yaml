security:
    role_hierarchy:
        ROLE_ADMIN: ROLE_BIBLIO
        ROLE_BIBLIO: ROLE_USER

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_utilisateur_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email
        app_adherent_provider:
            entity:
                class: App\Entity\Adherent
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            provider: app_adherent_provider
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            provider: app_adherent_provider
            jwt: ~
        main:
            lazy: true
            provider: app_utilisateur_provider
            custom_authenticator: App\Security\AdminAuthenticator
            logout:
                path: app_logout
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/admin, roles: ROLE_BIBLIO }
        - { path: ^/login, roles: PUBLIC_ACCESS }
